<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Bixcart</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-bg: #0f172a;
  --sidebar-hover: rgba(255,255,255,.06);
  --sidebar-active: rgba(255,255,255,.12);
  --sidebar-text: rgba(255,255,255,.5);
  --sidebar-text-active: #fff;
  --sidebar-border: rgba(255,255,255,.07);
  --topbar-h: 58px;
}

html { height: 100%; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  min-height: 100%;
  display: flex;
}

/* ═══════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════ */
.admin-sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: sticky;
  top: 0;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  flex-shrink: 0;
  z-index: 10;
}
.admin-sidebar::-webkit-scrollbar { display: none; }

.admin-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  height: 64px;
  border-bottom: 1px solid var(--sidebar-border);
  flex-shrink: 0;
}
.admin-logo-mark {
  font-family: 'Fredoka', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: white;
  letter-spacing: .2px;
  line-height: 1;
}
.admin-logo-mark span { color: var(--accent, #c8522a); }
.admin-logo-badge {
  font-size: 9px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--accent, #c8522a);
  background: rgba(200,82,42,.15);
  border: 1px solid rgba(200,82,42,.3);
  padding: 2px 7px;
  border-radius: 99px;
}

.admin-nav { padding: 12px 10px 24px; flex: 1; }
.admin-nav-section {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: rgba(255,255,255,.2);
  padding: 18px 12px 6px;
}
.admin-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--sidebar-text);
  cursor: pointer;
  transition: background .12s, color .12s;
  margin-bottom: 2px;
  border: none;
  background: none;
  text-align: left;
  font-family: var(--font-body);
}
.admin-nav-item svg { flex-shrink: 0; opacity: .7; transition: opacity .12s; }
.admin-nav-item:hover  { background: var(--sidebar-hover); color: rgba(255,255,255,.85); }
.admin-nav-item:hover svg { opacity: 1; }
.admin-nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); font-weight: 600; }
.admin-nav-item.active svg { opacity: 1; }

.admin-nav-badge {
  margin-left: auto;
  font-size: 10px;
  font-weight: 700;
  background: var(--accent, #c8522a);
  color: white;
  padding: 1px 7px;
  border-radius: 99px;
  min-width: 18px;
  text-align: center;
}

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--sidebar-border);
  flex-shrink: 0;
}
.sidebar-footer-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.7); margin-bottom: 1px; }
.sidebar-footer-role { font-size: 11px; color: rgba(255,255,255,.3); }

/* ═══════════════════════════════════════════
   MAIN AREA
═══════════════════════════════════════════ */
.admin-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  min-width: 0;
  overflow-x: hidden;
}

/* ── Topbar ── */
.admin-topbar {
  height: var(--topbar-h);
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 14px;
  background: var(--surface);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 40;
}
.mob-nav-toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ink);
  padding: 6px;
  border-radius: 8px;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  transition: background .12s;
}
.mob-nav-toggle:hover { background: var(--surface-2); }
.admin-topbar-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.admin-topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.topbar-signout {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font-body);
  color: var(--ink-3);
  background: none;
  border: 1.5px solid var(--border);
  cursor: pointer;
  transition: all .12s;
}
.topbar-signout:hover { background: var(--surface-2); color: var(--ink); }
.topbar-signout .so-label { }

/* ── Page content ── */
.admin-content { flex: 1; padding: 28px 32px; }

/* ═══════════════════════════════════════════
   STAT CARDS
═══════════════════════════════════════════ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: box-shadow .15s;
}
.stat-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.07); }
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--border);
  border-radius: 14px 14px 0 0;
}
.stat-card.warn::before   { background: #f59e0b; }
.stat-card.danger::before { background: #ef4444; }
.stat-card.success::before{ background: #10b981; }
.stat-card.warn   { background: #fffbeb; border-color: #fde68a; }
.stat-card.danger { background: #fef2f2; border-color: #fecaca; }
.stat-card-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink-3);
  margin-bottom: 10px;
}
.stat-card-value {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1.5px;
  line-height: 1;
  margin-bottom: 4px;
  font-family: var(--font-display);
}
.stat-card-sub { font-size: 12px; color: var(--ink-3); }

/* ═══════════════════════════════════════════
   TABLES
═══════════════════════════════════════════ */
.admin-table-wrap {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.admin-table { width: 100%; border-collapse: collapse; }
.admin-table thead tr { background: var(--bg); }
.admin-table th {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--ink-3);
  padding: 12px 18px;
  border-bottom: 1.5px solid var(--border);
  text-align: left;
  white-space: nowrap;
}
.admin-table td {
  padding: 13px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  vertical-align: middle;
}
.admin-table tr:last-child td { border-bottom: none; }
.admin-table tbody tr { transition: background .1s; }
.admin-table tbody tr:hover td { background: var(--bg); }
.mono { font-family: 'Courier New', monospace; font-size: 11px; color: var(--ink-3); }

.admin-toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.admin-search {
  flex: 1;
  min-width: 200px;
  padding: 9px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: var(--font-body);
  font-size: 13px;
  background: var(--surface);
  color: var(--ink);
  outline: none;
  transition: border-color .15s;
}
.admin-search:focus { border-color: var(--ink); }
.filter-select {
  padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-family: var(--font-body);
  font-size: 13px;
  background: var(--surface);
  color: var(--ink);
  outline: none;
  cursor: pointer;
}

/* ── Broadcast tab ── */
.bcast-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
.bcast-main { min-width: 0; }
.bcast-select-bar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  margin-bottom: 10px; font-size: 13px; color: var(--ink-2);
}
.bcast-check-label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.bcast-check-label input, .bcast-row-check { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.link-btn {
  background: none; border: none; padding: 0; color: var(--accent); font-weight: 600;
  font-size: 13px; cursor: pointer; font-family: var(--font-body); text-decoration: underline;
}
.link-btn.active { color: var(--ink); }
.bcast-selected-count {
  margin-left: auto; font-weight: 700; color: var(--ink);
  background: var(--bg); border: 1.5px solid var(--border); border-radius: 20px; padding: 4px 12px;
}
.bcast-compose {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg, 14px);
  padding: 18px; position: sticky; top: 16px;
}
.bcast-compose-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.bcast-field-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin: 10px 0 5px; }
.bcast-input, .bcast-textarea {
  width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px;
  font-family: var(--font-body); font-size: 13px; background: var(--bg); color: var(--ink);
  outline: none; resize: vertical; box-sizing: border-box;
}
.bcast-input:focus, .bcast-textarea:focus { border-color: var(--ink); }
.bcast-send-btn { width: 100%; margin-top: 14px; }
.bcast-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; line-height: 1.5; }
.bcast-history { margin-top: 22px; padding-top: 16px; border-top: 1.5px solid var(--border); }
.bcast-history-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.bcast-history-item:last-child { border-bottom: none; }
.bcast-history-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; }
.bcast-history-date { font-weight: 500; color: var(--ink-3); white-space: nowrap; }
.bcast-history-body { font-size: 12.5px; color: var(--ink-2); margin: 4px 0; line-height: 1.5; }
.bcast-history-meta { font-size: 11px; color: var(--ink-3); }
@media (max-width: 960px) {
  .bcast-layout { grid-template-columns: 1fr; }
  .bcast-compose { position: static; }
}

/* ── Action buttons ── */
.action-btns { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.action-btn {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 11px;
  border-radius: 7px;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  transition: all .12s;
  white-space: nowrap;
  font-family: var(--font-body);
}
.action-btn:hover     { background: var(--surface-2); }
.action-btn.view      { border-color: #93c5fd; color: #1d4ed8; background: #eff6ff; }
.action-btn.view:hover{ background: #dbeafe; }
.action-btn.warn      { border-color: #fbbf24; color: #92400e; background: #fffbeb; }
.action-btn.warn:hover{ background: #fef3c7; }
.action-btn.kick      { border-color: #fca5a5; color: #991b1b; background: #fef2f2; }
.action-btn.kick:hover{ background: #fee2e2; }
.action-btn.restore   { border-color: #6ee7b7; color: #065f46; background: #ecfdf5; }
.action-btn.restore:hover{ background: #d1fae5; }

/* Pagination */
.pg-btn {
  padding: 6px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  font-size: 13px;
  font-family: var(--font-body);
  transition: all .12s;
}
.pg-btn:hover:not(:disabled) { background: var(--surface-2); }
.pg-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ═══════════════════════════════════════════
   DRAWER
═══════════════════════════════════════════ */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 900;
  backdrop-filter: blur(2px);
}
.drawer {
  position: fixed;
  right: 0; top: 0;
  height: 100dvh;
  width: 420px;
  max-width: 94vw;
  background: var(--surface);
  border-left: 1.5px solid var(--border);
  z-index: 901;
  overflow-y: auto;
  box-shadow: -12px 0 48px rgba(0,0,0,.12);
  display: flex;
  flex-direction: column;
}
.drawer-header {
  padding: 20px 22px;
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}
.drawer-header h3 { font-size: 15px; font-weight: 700; }
.drawer-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ink-3);
  display: flex;
  padding: 5px;
  border-radius: 7px;
  transition: background .12s;
}
.drawer-close:hover { background: var(--surface-2); color: var(--ink); }
.drawer-body { padding: 22px; flex: 1; }
.drawer-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  gap: 12px;
}
.drawer-row:last-child { border-bottom: none; }
.drawer-row-label { color: var(--ink-3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; flex-shrink: 0; padding-top: 1px; }
#drawer-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 20px;
}
#drawer-actions button {
  padding: 11px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  font-family: var(--font-body);
  transition: all .12s;
  border: 1.5px solid;
}

/* ═══════════════════════════════════════════
   REPORT / FLAGGED
═══════════════════════════════════════════ */
.msg-layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: calc(100dvh - var(--topbar-h) - 56px);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  background: var(--surface);
}
.msg-list {
  border-right: 1.5px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.msg-panel { overflow-y: auto; background: var(--bg); }
.msg-panel-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--ink-3);
  font-size: 14px;
  gap: 10px;
}
.msg-panel-header {
  padding: 16px 20px;
  border-bottom: 1.5px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 1;
}
.msg-panel-header h4 { margin: 0 0 3px; font-size: 14px; font-weight: 700; }
.msg-panel-header p  { margin: 0; font-size: 12px; color: var(--ink-3); }
.msg-thread { padding: 18px 20px; }
.msg-bubble-wrap { display: flex; flex-direction: column; margin-bottom: 12px; }
.msg-bubble-wrap.right { align-items: flex-end; }
.msg-sender-label { font-size: 11px; color: var(--ink-3); margin-bottom: 4px; font-weight: 500; }
.msg-bubble {
  max-width: 72%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.55;
  background: var(--surface);
  border: 1.5px solid var(--border);
}
.msg-bubble-wrap.right .msg-bubble { background: var(--ink); color: white; border-color: transparent; }
.msg-time { font-size: 10px; color: var(--ink-3); margin-top: 4px; }

.conv-list-item {
  padding: 14px 16px;
  border-bottom: 1.5px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
.conv-list-item:hover  { background: var(--bg); }
.conv-list-item.active { background: var(--surface-2); border-left: 3px solid var(--accent, #c8522a); }
.conv-participants { font-size: 13px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-snippet { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
.conv-meta { font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.report-badge { display: inline-block; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; }
.report-badge.pending  { background: #fef3c7; color: #92400e; }
.report-badge.resolved { background: #d1fae5; color: #065f46; }
.report-filter-tabs { display: flex; background: var(--surface); border-bottom: 1.5px solid var(--border); }
.report-filter-tab { padding: 10px 14px; font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2.5px solid transparent; color: var(--ink-3); transition: all .13s; }
.report-filter-tab.active { color: var(--ink); border-bottom-color: var(--accent, #c8522a); }

.report-detail-card { margin: 14px 18px; padding: 14px 16px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; }
.rdc-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 10px; }
.rdc-row { font-size: 13px; margin-bottom: 6px; }
.rdc-label { color: var(--ink-3); font-size: 11px; }
.fault-section { margin: 0 18px 18px; padding: 16px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; }
.fs-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin-bottom: 12px; }
.fault-select, .fault-note-ta { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 9px; font-family: var(--font-body); font-size: 13px; background: var(--bg); color: var(--ink); outline: none; }
.fault-note-ta { resize: vertical; min-height: 64px; box-sizing: border-box; margin-top: 10px; }
.fault-select:focus, .fault-note-ta:focus { border-color: var(--ink); }
.notify-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 18px 18px; }
.notify-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px; }
.notify-card .nc-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
.notify-card .nc-name { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.notify-ta { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 9px; font-family: var(--font-body); font-size: 13px; background: var(--bg); color: var(--ink); resize: vertical; min-height: 64px; outline: none; box-sizing: border-box; margin-bottom: 8px; }
.notify-ta:focus { border-color: #7c3aed; }
.notify-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.nc-send-btn { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; background: #7c3aed; color: white; font-family: var(--font-body); transition: background .12s; }
.nc-send-btn:hover { background: #6d28d9; }
.nc-warn-btn, .nc-susp-btn, .nc-rest-btn { font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-family: var(--font-body); }
.nc-warn-btn { border: 1.5px solid #fbbf24; background: #fffbeb; color: #92400e; }
.nc-susp-btn { border: 1.5px solid #fca5a5; background: #fef2f2; color: #991b1b; }
.nc-rest-btn { border: 1.5px solid #6ee7b7; background: #ecfdf5; color: #065f46; }

/* ═══════════════════════════════════════════
   SKELETON
═══════════════════════════════════════════ */
.skeleton { background: var(--surface-2); border-radius: 6px; animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:.45} }
.tbl-skeleton td { padding: 14px 18px; }
.admin-empty { padding: 48px; text-align: center; color: var(--ink-3); font-size: 14px; }

/* ═══════════════════════════════════════════
   SIDEBAR OVERLAY (mobile)
═══════════════════════════════════════════ */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 1099;
  backdrop-filter: blur(2px);
}
.sidebar-overlay.open { display: block; }

/* ═══════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media (max-width: 960px) {
  body { display: block; overflow-y: auto; }

  /* Sidebar off-canvas */
  .admin-sidebar {
    position: fixed;
    left: -260px;
    top: 0;
    z-index: 1100;
    height: 100dvh;
    transition: left .25s cubic-bezier(.4,0,.2,1);
    box-shadow: none;
  }
  .admin-sidebar.open {
    left: 0;
    box-shadow: 8px 0 48px rgba(0,0,0,.35);
  }

  /* Main fills viewport */
  .admin-main { min-height: 100dvh; width: 100%; }
  .admin-content { padding: 20px; }
  .admin-topbar { padding: 0 18px; }

  /* Show hamburger */
  .mob-nav-toggle { display: flex !important; }

  /* Hide sign-out text */
  .so-label { display: none; }

  .stat-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .stat-card { padding: 16px 14px; }
  .stat-card-value { font-size: 28px; }
}

@media (max-width: 768px) {
  .admin-content { padding: 14px; }
  .admin-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .admin-table { min-width: 540px; }
  .admin-table th, .admin-table td { padding: 10px 14px; }
  .admin-toolbar { flex-wrap: wrap; }
  .admin-search, .filter-select { min-width: 100%; }
  .msg-layout { grid-template-columns: 1fr; height: auto; }
  .msg-list { max-height: 280px; border-right: none; border-bottom: 1.5px solid var(--border); }
  .msg-panel { min-height: 360px; }
  .drawer { width: 100%; max-width: 100%; }
  .notify-grid { grid-template-columns: 1fr; margin: 0 14px 14px; }
  .flagged-card-inner  { flex-direction: column !important; }
  .flagged-card-actions { flex-direction: row !important; flex-wrap: wrap; gap: 6px !important; min-width: unset !important; width: 100% !important; }
  .flagged-card-actions .action-btn { flex: 1 1 calc(50% - 4px); text-align: center; }
}

@media (max-width: 520px) {
  .stat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card-value { font-size: 24px; }
  .admin-content { padding: 10px; }
  .admin-topbar-title { font-size: 13px; }
  .admin-table { min-width: 460px; }
}
.control-mode [data-ur-uphold], .control-mode [data-ur-dismiss], .control-mode .notify-actions, .control-mode #resolve-btn, .control-mode .flagged-card-actions .action-btn:not(.view) { display:none !important; }
</style>
</head>

<script src="../js/app.js"></script>
<script>
// ── Admin auth — uses SEPARATE localStorage keys from user auth ────────────
const ADMIN_TOKEN_KEY = 'cm_admin_token';
const ADMIN_USER_KEY  = 'cm_admin_user';

const adminAuth = {
  getToken: () => localStorage.getItem(ADMIN_TOKEN_KEY),
  getUser:  () => { try { return JSON.parse(localStorage.getItem(ADMIN_USER_KEY)); } catch { return null; } },
  clear()   { localStorage.removeItem(ADMIN_TOKEN_KEY); localStorage.removeItem(ADMIN_USER_KEY); },
};

// Override api.request to always use the admin token on this page
api.request = async function(method, path, body, useAuth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (useAuth) {
    const token = adminAuth.getToken();
    if (token) headers['Authorization'] = `Bearer ${token}`;
  }
  const res = await fetch(`/api${path}`, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
};

// ── api.patch — not in app.js ────────────────────────────────────────────────
api.patch = (path, body) => api.request('PATCH', path, body, true);

// ── Auth guard ──────────────────────────────────────────────────────────────
(function() {
  const token = adminAuth.getToken();
  const u     = adminAuth.getUser();
  if (!token || !['admin','control'].includes(u?.role)) {
    window.location.replace('admin-login.html'); return;
  }
  // Populate admin identity
  document.getElementById('admin-user-badge').textContent   = u.full_name || 'Admin';
  const sidebarName = document.getElementById('sidebar-admin-name');
  if (sidebarName) sidebarName.textContent = u.full_name || u.email || 'Admin';
  const roleEl = document.getElementById('sidebar-admin-role');
  if (roleEl) roleEl.textContent = u.role === 'control' ? 'Control · Limited Admin' : 'Administrator';
  if (u.role === 'control') {
    document.body.classList.add('control-mode');
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
    ['overview','deletion-requests','users','listings','broadcast','hostels','delivery-spots'].forEach(tab => document.querySelector(`[data-tab="${tab}"]`)?.style.setProperty('display','none'));
  }
})();

function adminLogout() { adminAuth.clear(); window.location.replace('admin-login.html'); }

// ── Tab routing ─────────────────────────────────────────────────────────────
const isControlUser = () => adminAuth.getUser()?.role === 'control';
const controlPath = path => isControlUser() ? path.replace(/^\/admin/, '/control') : path;
const TABS = { overview: 'Overview', commission: 'Commission', controls: 'Controls', 'control-actions': 'Control Actions', 'seller-approvals': 'Seller Approvals', 'deletion-requests': 'Account Deletions', actions: 'Admin Actions', users: 'Users', listings: 'Listings', broadcast: 'Broadcast', hostels: 'Hostels', 'delivery-spots': 'Delivery Spots', messages: 'Conversation Reports', 'user-reports': 'User Reports', flagged: 'AI Flagged' };
const ACTION_LABELS = {
  seller_approved: 'Approved seller', seller_rejected: 'Rejected seller',
  seller_override: 'Overrode seller decision',
  user_warned: 'Warned user', user_suspended: 'Suspended user', user_unsuspended: 'Restored user',
  account_deletion_approved: 'Approved account deletion', account_deletion_rejected: 'Rejected account deletion',
  control_created: 'Created Control account', control_action_reversed: 'Reversed Control action', commission_changed: 'Changed platform commission',
};
let currentTab = isControlUser() ? 'seller-approvals' : 'overview';

document.querySelectorAll('.admin-nav-item[data-tab]').forEach(btn => { btn.addEventListener('click', () => switchTab(btn.dataset.tab)); });
if (isControlUser()) switchTab('seller-approvals');

// ── Mobile sidebar ────────────────────────────────────────────────────────────
const sidebar  = document.getElementById('admin-sidebar');
const overlay  = document.getElementById('sidebar-overlay');
const hamburger = document.getElementById('mob-nav-toggle');

function openSidebar()  { sidebar.classList.add('open');  overlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); document.body.style.overflow = ''; }

hamburger.addEventListener('click', openSidebar);
overlay.addEventListener('click', closeSidebar);
document.querySelectorAll('.admin-nav-item[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => { if (window.innerWidth <= 960) closeSidebar(); });
});

// Show hamburger only on mobile (CSS handles display but we also do it in JS for reliability)
function updateHamburgerVisibility() {
  hamburger.style.display = window.innerWidth <= 960 ? 'flex' : 'none';
}
updateHamburgerVisibility();
window.addEventListener('resize', updateHamburgerVisibility);

// Sign-out button
document.getElementById('admin-signout-btn').addEventListener('click', adminLogout);

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.admin-nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('topbar-title').textContent = TABS[tab];
  const content = document.getElementById('admin-content');
  content.innerHTML = '<div class="admin-empty">Loading…</div>';
  if (tab === 'overview')  renderOverview();
  if (tab === 'commission') renderCommission();
  if (tab === 'controls') renderControls();
  if (tab === 'control-actions') renderControlActions();
  if (tab === 'seller-approvals') renderSellerApprovals();
  if (tab === 'deletion-requests') renderDeletionRequests();
  if (tab === 'actions') renderAdminActions();
  if (tab === 'users')     renderUsers();
  if (tab === 'listings')  renderListings();
  if (tab === 'broadcast') renderBroadcast();
  if (tab === 'hostels')   renderHostels();
  if (tab === 'delivery-spots') renderDeliverySpots();
  if (tab === 'messages')  renderMessages();
  if (tab === 'user-reports') renderUserReports();
  if (tab === 'flagged')   renderFlagged();
}

// ══════════════════════════════════════════════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════════════════════════════════════════════
async function renderControls() {
  const c=document.getElementById('admin-content');
  c.innerHTML='<div style="margin-bottom:18px"><div class="section-kicker">Access management</div><h2 style="font-size:28px">Control accounts</h2><p style="color:var(--ink-3);font-size:13px">Create limited administrators who can approve/reject sellers and read reports.</p></div><div class="card" style="padding:18px;margin-bottom:18px"><h3>Add a new Control</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="control-name" class="form-input" placeholder="Full name"><input id="control-email" class="form-input" type="email" placeholder="Email"><input id="control-password" class="form-input" type="password" placeholder="Password (8+ characters)"></div><button id="create-control-btn" class="btn btn-primary" style="margin-top:12px">Create Control</button></div><div id="controls-list">Loading…</div>';
  document.getElementById('create-control-btn').onclick=async()=>{try{await api.post('/admin/controls',{full_name:document.getElementById('control-name').value.trim(),email:document.getElementById('control-email').value.trim(),password:document.getElementById('control-password').value});toast('Control account created.','success');renderControls();}catch(e){toast(e.message,'error');}};
  try{const d=await api.get('/admin/controls');const rows=d.controls||[];document.getElementById('controls-list').innerHTML=rows.length?'<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody>'+rows.map(u=>`<tr><td><strong>${escHtml(u.full_name)}</strong></td><td>${escHtml(u.email)}</td><td>${escHtml(u.account_status)}</td></tr>`).join('')+'</tbody></table></div>':'<div class="admin-empty">No Control accounts yet.</div>';}catch(e){document.getElementById('controls-list').textContent=e.message;}
}
async function renderControlActions(){
  const c=document.getElementById('admin-content');c.innerHTML='<div style="margin-bottom:18px"><div class="section-kicker">Audit trail</div><h2 style="font-size:28px">Control Actions</h2><p style="color:var(--ink-3);font-size:13px">Every action by a Control is recorded with the Control name. Admins can reverse a decision back to how it was, or override it with a specific new decision.</p></div><div id="control-actions-list">Loading…</div>';
  try{
    const d=await api.get('/admin/control-actions?limit=100');
    const rows=d.actions||[];
    document.getElementById('control-actions-list').innerHTML=rows.length?'<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Control</th><th>Action</th><th>Target</th><th>Reversed</th><th></th></tr></thead><tbody>'+rows.map(a=>`<tr><td>${fmtTime(a.created_at)}</td><td><strong>${escHtml(a.admin_name)}</strong></td><td>${escHtml(ACTION_LABELS[a.action]||a.action)}</td><td>${escHtml(a.target_user_name||a.target_user_email||'—')}</td><td>${a.reversed_at?fmtTime(a.reversed_at):'No'}</td><td style="white-space:nowrap;">${a.reversible&&!a.reversed_at?`<button class="btn btn-surface btn-sm" onclick="reverseControlAction('${a.id}')">Reverse</button> `:''}${['seller_approved','seller_rejected'].includes(a.action)&&!a.reversed_at&&a.target_user_id?`<button class="btn btn-primary btn-sm" onclick="overrideControlAction('${a.target_user_id}','${a.target_user_name?escHtml(a.target_user_name).replace(/'/g,"\\'"):''}')">Override</button>`:''}</td></tr>`).join('')+'</tbody></table></div>':'<div class="admin-empty">No Control actions recorded.</div>';
  }catch(e){document.getElementById('control-actions-list').textContent=e.message;}
}
window.reverseControlAction=async function(id){if(!confirm('Reverse this Control action? This restores the seller to exactly the state they were in before the Control acted.'))return;try{await api.post(`/admin/control-actions/${id}/reverse`,{});toast('Control action reversed.','success');renderControlActions();}catch(e){toast(e.message,'error');}};

// Lets an admin set a seller's approval decision to a specific new state —
// approved, rejected, or reopened to pending — regardless of what a Control
// account (or a prior admin decision) already set it to. Unlike "Reverse",
// which restores the exact prior state, this lets the admin choose the
// outcome directly.
window.overrideControlAction = function(sellerId, sellerName) {
  const label = sellerName ? ` for ${sellerName}` : '';
  const modalHtml = `
    <div style="display:grid;gap:12px;">
      <p style="font-size:13px;color:var(--ink-3);">Choose the new decision${label}. This overrides whatever the Control account (or a prior admin) decided, and the seller is notified immediately.</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" id="override-approve-btn">Set: Approved</button>
        <button class="btn btn-danger btn-sm" id="override-reject-btn">Set: Rejected</button>
        <button class="btn btn-ghost btn-sm" id="override-pending-btn">Reopen: Pending</button>
      </div>
    </div>`;
  showDrawer(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;"><div><div class="section-kicker">Admin override</div><h2 style="margin:4px 0 0;font-size:22px;">Override seller decision</h2></div><button class="btn btn-ghost btn-sm" onclick="closeDrawer()">Close</button></div>${modalHtml}`);
  document.getElementById('override-approve-btn').addEventListener('click', () => submitOverride(sellerId, 'approved'));
  document.getElementById('override-reject-btn').addEventListener('click', () => {
    closeDrawer();
    showModal({ title: 'Override — reject seller', sub: 'A reason is required so the seller understands the decision.', placeholder: 'Explain why this seller is being rejected…', confirmLabel: 'Confirm override', confirmClass: 'btn-danger', onConfirm: reason => submitOverride(sellerId, 'rejected', reason) });
  });
  document.getElementById('override-pending-btn').addEventListener('click', () => submitOverride(sellerId, 'pending'));
};

async function submitOverride(sellerId, status, reason = '') {
  try {
    await api.post(`/admin/seller-applications/${sellerId}/override`, { status, reason });
    closeDrawer();
    toast('Decision overridden.', 'success');
    renderControlActions();
  } catch (e) { toast(e.message, 'error'); }
}

// ══════════════════════════════════════════════════════════════════════════════
// SELLER APPROVALS
// ══════════════════════════════════════════════════════════════════════════════
async function renderSellerApprovals() {
  const c = document.getElementById('admin-content');
  c.innerHTML = '<div class="admin-empty">Loading seller applications…</div>';
  try {
    const data = await api.get(controlPath('/admin/seller-applications?status=pending&limit=100'));
    const sellers = data.sellers || [];

// ── Helpers ──────────────────────────────────────────────────────────────────
const fmt = d => d ? new Date(d).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const fmtTime = d => d ? new Date(d).toLocaleString('en-NG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function statusBadge(s) {
  const map = { active: 'badge-active', warned: 'badge-warned', suspended: 'badge-suspended' };
  return `<span class="badge ${map[s] || 'badge-listing'}">${s || 'active'}</span>`;
}
function roleBadge(r) {
  const map = { buyer: 'badge-buyer', seller: 'badge-seller' };
  return `<span class="badge ${map[r] || ''}">${r}</span>`;
}
function listingStatusBadge(s) {
  const map = { active: 'badge-active-l', pending: 'badge-pending', sold: 'badge-sold', deleted: 'badge-deleted' };
  return `<span class="badge ${map[s] || 'badge-listing'}">${s}</span>`;
}
function skeletonRows(cols, n = 5) {
  return Array(n).fill(0).map(() =>
    `<tr class="tbl-skeleton">${Array(cols).fill(0).map(() =>
      `<td><div class="skeleton" style="height:14px;border-radius:4px;width:${60+Math.random()*30}%"></div></td>`).join('')}</tr>`).join('');
}

// paginationHTML no longer uses onclick= strings — buttons get data-page attributes
// and a delegated listener is attached after injection.
function paginationHTML(page, pages, total) {
  if (pages <= 1) return '';
  let html = `<div class="admin-pagination">`;
  html += `<button class="pg-btn" data-page="${page-1}" ${page===1?'disabled':''}>←</button>`;
  for (let i = 1; i <= pages; i++) {
    if (pages > 7 && Math.abs(i-page) > 2 && i !== 1 && i !== pages) {
      if (i === 2 || i === pages-1) html += `<span style="padding:0 4px;color:var(--ink-3)">…</span>`;
      continue;
    }
    html += `<button class="pg-btn ${i===page?'active':''}" data-page="${i}">${i}</button>`;
  }
  html += `<button class="pg-btn" data-page="${page+1}" ${page===pages?'disabled':''}>→</button>`;
  html += `<span class="pg-info">${total} total</span></div>`;
  return html;
}

// Wire a pagination container after it has been injected into the DOM.
// fetchFn is called with the page number when a button is clicked.
function bindPagination(containerId, fetchFn) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.addEventListener('click', e => {
    const btn = e.target.closest('.pg-btn');
    if (!btn || btn.disabled) return;
    const p = parseInt(btn.dataset.page, 10);
    if (!isNaN(p)) fetchFn(p);
  });
}

// ── Static Modal — event listeners wired ONCE ────────────────────────────────
let _modalCb       = null;
let _modalNoReason = false;

function showModal({ title, sub, placeholder, confirmLabel, confirmClass = 'btn-primary', onConfirm, noReason }) {
  _modalCb       = onConfirm;
  _modalNoReason = !!noReason;

  document.getElementById('admin-modal-title').textContent  = title;
  document.getElementById('admin-modal-sub').textContent    = sub || '';
  document.getElementById('admin-modal-confirm').textContent = confirmLabel;
  document.getElementById('admin-modal-confirm').className  = `btn ${confirmClass}`;
  document.getElementById('admin-modal-reason').placeholder = placeholder || 'Enter reason…';
  document.getElementById('admin-modal-reason').value       = '';
  document.getElementById('admin-modal-reason').style.borderColor = '';
  document.getElementById('admin-modal-reason-wrap').style.display = noReason ? 'none' : 'block';
  document.getElementById('admin-modal').style.display = 'flex';
  if (!noReason) document.getElementById('admin-modal-reason').focus();
}

function closeModal() {
  document.getElementById('admin-modal').style.display = 'none';
  _modalCb = null;
}

// Wire confirm / back ONCE — never re-attached
document.getElementById('admin-modal-confirm').addEventListener('click', () => {
  const reason = _modalNoReason ? null : document.getElementById('admin-modal-reason').value.trim();
  if (!_modalNoReason && !reason) {
    document.getElementById('admin-modal-reason').style.borderColor = 'var(--red,#e53e3e)';
    return;
  }
  const cb = _modalCb;
  closeModal();
  if (cb) cb(reason);
});

document.getElementById('admin-modal-back').addEventListener('click', closeModal);
document.getElementById('admin-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('admin-modal')) closeModal();
});
function closeDrawer() {
  document.getElementById('drawer-root').innerHTML = '';
}

function showDrawer(html) {
  const root = document.getElementById('drawer-root');
  root.innerHTML = `
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="drawer">${html}</div>`;
  history.pushState({ bixOverlay: 'drawer' }, '');
  root.querySelector('.drawer-overlay').addEventListener('click', closeDrawer);
}

// Hardware back button: close any open overlay
window.addEventListener('popstate', () => {
  if (document.getElementById('admin-modal').style.display !== 'none') { closeModal(); return; }
  if (document.getElementById('drawer-root').innerHTML) { closeDrawer(); }
});

        <div style="font-weight:800;font-size:17px;margin-bottom:6px">Pending change: ${Number(p.proposed_percent).toFixed(1)}%</div>
        <div style="font-size:13px;color:var(--ink-3);margin-bottom:14px">Proposed by ${escHtml(p.proposed_by?.full_name || p.proposed_by?.email || 'Admin')}${p.reason ? ` · ${escHtml(p.reason)}` : ''}</div>
        ${isProposer ? `<div class="notice notice-info">You proposed this change. A different admin must vote Agree or Disagree before the rate can change.</div>` : `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" onclick="voteCommission('${p.id}','agree')">✓ Agree</button><button class="btn btn-danger" onclick="voteCommission('${p.id}','disagree')">✕ Disagree</button></div>`}
      </div>` : `<div class="card" style="padding:20px;margin-bottom:18px"><h3 style="margin-bottom:12px">Propose a new rate</h3><div style="display:grid;grid-template-columns:180px 1fr;gap:10px"><input id="commission-rate" class="form-input" type="number" min="0" max="100" step="0.1" value="${Number(d.commission_percent).toFixed(1)}"><input id="commission-reason" class="form-input" placeholder="Reason for the change (optional)"></div><button class="btn btn-primary" style="margin-top:12px" onclick="proposeCommission()">Create vote</button></div>`}
      <div><h3 style="font-size:17px;margin-bottom:10px">Recent decisions</h3>${(d.history||[]).length ? `<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Proposed by</th><th>Rate</th><th>Decision</th></tr></thead><tbody>${d.history.map(x=>`<tr><td>${fmtTime(x.decided_at || x.created_at)}</td><td>${escHtml(x.proposed_by?.full_name || 'Admin')}</td><td>${Number(x.proposed_percent).toFixed(1)}%</td><td>${escHtml(x.status)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="admin-empty">No commission changes yet.</div>'}</div>`;

window.proposeCommission = async function() {
  const rate = Number(document.getElementById('commission-rate')?.value);
  const reason = document.getElementById('commission-reason')?.value?.trim() || '';
  if (!Number.isFinite(rate) || rate < 0 || rate > 100) return toast('Enter a valid commission between 0% and 100%.', 'error');
  try { await api.post('/admin/commission/proposals', { proposed_percent: rate, reason }); toast('Commission change proposed. Another admin must vote.', 'success'); renderCommission(); } catch(e) { toast(e.message, 'error'); }
};
window.voteCommission = async function(id, vote) {
  const word = vote === 'agree' ? 'Agree' : 'Disagree';
  if (!confirm(`${word} to this commission change?`)) return;
  try { const r = await api.post(`/admin/commission/proposals/${id}/vote`, { vote }); toast(r.status === 'approved' ? `Commission changed to ${Number(r.commission_percent).toFixed(1)}%.` : 'Proposal rejected.', r.status === 'approved' ? 'success' : 'warning'); renderCommission(); } catch(e) { toast(e.message, 'error'); }
};

let usersState = { q: '', role: 'all', status: 'all', page: 1 };

async function renderUsers(resetPage) {
  if (resetPage) usersState.page = 1;
  const c = document.getElementById('admin-content');
  c.innerHTML = `
    <div class="admin-toolbar">
      <input class="admin-search" id="user-search" placeholder="Search name or email…" value="${escHtml(usersState.q)}">
      <select class="filter-select" id="user-role-filter">
        <option value="all" ${usersState.role==='all'?'selected':''}>All roles</option>
        <option value="buyer" ${usersState.role==='buyer'?'selected':''}>Buyers</option>
        <option value="seller" ${usersState.role==='seller'?'selected':''}>Sellers</option>
      </select>
      <select class="filter-select" id="user-status-filter">
        <option value="all" ${usersState.status==='all'?'selected':''}>All statuses</option>
        <option value="active" ${usersState.status==='active'?'selected':''}>Active</option>
        <option value="warned" ${usersState.status==='warned'?'selected':''}>Warned</option>
        <option value="suspended" ${usersState.status==='suspended'?'selected':''}>Suspended</option>
      </select>
    </div>
    <div class="admin-table-wrap" id="users-table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>Name</th><th>Email</th><th>Role</th><th>Status</th>
          <th>Listings</th><th>Joined</th><th>Actions</th>
        </tr></thead>
        <tbody id="users-tbody">${skeletonRows(7)}</tbody>
      </table>
      <div id="users-pagination"></div>
    </div>`;

  let searchTimer;
  document.getElementById('user-search').addEventListener('input', e => {
    usersState.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => fetchUsers(1), 350);
  });
  document.getElementById('user-role-filter').addEventListener('change', e => { usersState.role = e.target.value; fetchUsers(1); });
  document.getElementById('user-status-filter').addEventListener('change', e => { usersState.status = e.target.value; fetchUsers(1); });

  // Delegated listener on the stable wrapper — attached ONCE here, not inside fetchUsers.
  // Survives tbody innerHTML replacements on pagination/filter changes.
  document.getElementById('users-table-wrap').addEventListener('click', e => {
    const btn = e.target.closest('.action-btn[data-action]');
    if (!btn) return;
    const { action, id, name } = btn.dataset;
    if (action === 'view')    openUserDrawer(id);
    if (action === 'warn')    warnUser(id, name);
    if (action === 'suspend') suspendUser(id, name);
    if (action === 'restore') unsuspendUser(id, name);
    if (action === 'delete')  kickUser(id, name);
  });

  fetchUsers(usersState.page);
}

async function fetchUsers(page) {
  usersState.page = page;
  const tbody = document.getElementById('users-tbody');
  const pgDiv = document.getElementById('users-pagination');
  if (!tbody) return;
  tbody.innerHTML = skeletonRows(7);
  try {
    const { q, role, status } = usersState;
    const params = new URLSearchParams({ page, limit: 20 });
    if (q) params.set('q', q);
    if (role !== 'all') params.set('role', role);
    if (status !== 'all') params.set('status', status);
    const data = await api.get(`/admin/users?${params}`);
    if (!data.users.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--ink-3);padding:32px">No users found</td></tr>`;
      pgDiv.innerHTML = ''; return;
    }

    tbody.innerHTML = data.users.map(u => `
      <tr>
        <td class="name-cell">${escHtml(u.full_name)}</td>
        <td class="mono">${escHtml(u.email)}</td>
        <td>${roleBadge(u.role)}</td>
        <td>${statusBadge(u.account_status)}</td>
        <td>${u.listing_count || 0}</td>
        <td>${fmt(u.created_at)}</td>
        <td>
          <div class="action-btns">
            <button class="action-btn view"    data-action="view"    data-id="${u._id}">View</button>
            ${u.account_status !== 'warned' && u.account_status !== 'suspended'
              ? `<button class="action-btn warn"    data-action="warn"    data-id="${u._id}" data-name="${escHtml(u.full_name)}">Warn</button>` : ''}
            ${u.account_status !== 'suspended'
              ? `<button class="action-btn suspend" data-action="suspend" data-id="${u._id}" data-name="${escHtml(u.full_name)}">Suspend</button>`
              : `<button class="action-btn restore" data-action="restore" data-id="${u._id}" data-name="${escHtml(u.full_name)}">Restore</button>`}
            <button class="action-btn kick"    data-action="delete"  data-id="${u._id}" data-name="${escHtml(u.full_name)}">Delete</button>
          </div>
        </td>
      </tr>`).join('');

    pgDiv.innerHTML = paginationHTML(data.page, data.pages, data.total);
    bindPagination('users-pagination', fetchUsers);
  } catch(e) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="7" style="color:var(--red,#e53e3e);padding:20px">${e.message}</td></tr>`;
  }
}
window.fetchUsers = fetchUsers;

// ── User actions ─────────────────────────────────────────────────────────────
function warnUser(id, name) {
  showModal({
    title: `Warn ${name}`,
    sub: 'A warning will be recorded on this account.',
    placeholder: 'e.g. Inappropriate listing content',
    confirmLabel: 'Send Warning',
    confirmClass: 'btn-accent',
    onConfirm: async (reason) => {
      try {
        await api.post(`/admin/users/${id}/warn`, { reason });
        toast(`${name} has been warned.`, 'success');
        if (currentTab === 'users') fetchUsers(usersState.page);
      } catch(e) { toast(e.message, 'error'); }
    }
  });
}

function suspendUser(id, name) {
  showModal({
    title: `Suspend ${name}`,
    sub: 'This user will be prevented from using the platform.',
    placeholder: 'e.g. Repeated policy violations',
    confirmLabel: 'Suspend Account',
    confirmClass: 'btn-primary',
    onConfirm: async (reason) => {
      try {
        await api.post(`/admin/users/${id}/suspend`, { reason });
        toast(`${name} has been suspended.`, 'success');
        if (currentTab === 'users') fetchUsers(usersState.page);
      } catch(e) { toast(e.message, 'error'); }
    }
  });
}

function unsuspendUser(id, name) {
  showModal({
    title: `Restore ${name}`,
    sub: 'This will lift the suspension and restore full access.',
    confirmLabel: 'Restore Account',
    confirmClass: 'btn-primary',
    noReason: true,
    onConfirm: async () => {
      try {
        await api.post(`/admin/users/${id}/unsuspend`, {});
        toast(`${name}'s account has been restored.`, 'success');
        if (currentTab === 'users') fetchUsers(usersState.page);
      } catch(e) { toast(e.message, 'error'); }
    }
  });
}

function kickUser(id, name) {
  showModal({
    title: `Delete ${name}'s account?`,
    sub: 'This permanently deletes the account, all their listings, and conversations. This cannot be undone.',
    noReason: true,
    confirmLabel: 'Yes, Delete Account',
    confirmClass: 'btn-primary',
    onConfirm: async () => {
      try {
        await api.delete(`/admin/users/${id}`);
        toast(`${name}'s account has been deleted.`, 'success');
        if (currentTab === 'users') fetchUsers(usersState.page);
      } catch(e) { toast(e.message, 'error'); }
    }
  });
}

function sendAdminMessage(id, name) {
  showModal({
    title: `Message ${name}`,
    sub: 'This will send a push notification and inbox message to the user.',
    placeholder: 'e.g. Your listing was reviewed and restored.',
    confirmLabel: 'Send Message',
    confirmClass: 'btn-primary',
    onConfirm: async (message) => {
      try {
        await api.post(`/admin/users/${id}/message`, { message });
        toast(`Message sent to ${name}.`, 'success');
      } catch(e) { toast(e.message, 'error'); }
    },
  });
}

            <option value="all">All universities</option>
          </select>
        </div>

        <div class="bcast-select-bar">
          <label class="bcast-check-label">
            <input type="checkbox" id="bcast-select-page"> Select all on this page
          </label>
          <button class="link-btn" id="bcast-select-all-matching">Select all <span id="bcast-matching-count">…</span> matching filters</button>
          <span class="bcast-selected-count" id="bcast-selected-count">0 selected</span>
        </div>

        <div class="admin-table-wrap" id="bcast-table-wrap">
          <table class="admin-table">
            <thead><tr>
              <th style="width:36px"></th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Verified</th>
            </tr></thead>
            <tbody id="bcast-tbody">${skeletonRows(6)}</tbody>
          </table>
          <div id="bcast-pagination"></div>
        </div>
      </div>

      <div class="bcast-compose">
        <div class="bcast-compose-title">Compose message</div>
        <label class="bcast-field-label">Title <span style="font-weight:400;color:var(--ink-3)">(optional)</span></label>
        <input class="bcast-input" id="bcast-title" placeholder="e.g. Scheduled maintenance" maxlength="120">
        <label class="bcast-field-label">Message</label>
        <textarea class="bcast-textarea" id="bcast-message" rows="6" placeholder="Write the message users will see as a popup…" maxlength="2000"></textarea>
        <button class="btn btn-primary bcast-send-btn" id="bcast-send-btn">Send message</button>
        <div class="bcast-hint">Recipients will see this as a popup the next time they open or refresh the app, with a button to confirm they've read it.</div>

        <div class="bcast-history">
          <div class="bcast-compose-title" style="margin-top:4px;">Recent broadcasts</div>
          <div id="bcast-history-list"><div class="admin-empty" style="padding:16px 0;">Loading…</div></div>
        </div>
      </div>
    </div>`;

  // Filters
  let searchTimer;
  document.getElementById('bcast-search').addEventListener('input', e => {
    broadcastState.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => fetchBroadcastRecipients(1), 350);
  });
  document.getElementById('bcast-role-filter').addEventListener('change', e => { broadcastState.role = e.target.value; fetchBroadcastRecipients(1); });
  document.getElementById('bcast-status-filter').addEventListener('change', e => { broadcastState.status = e.target.value; fetchBroadcastRecipients(1); });
  document.getElementById('bcast-verified-filter').addEventListener('change', e => { broadcastState.verified = e.target.value; fetchBroadcastRecipients(1); });
  document.getElementById('bcast-university-filter').addEventListener('change', e => { broadcastState.university = e.target.value; fetchBroadcastRecipients(1); });

  // Select-all-on-page checkbox
  document.getElementById('bcast-select-page').addEventListener('change', e => {
    broadcastSelectAllMatching = false;
    document.querySelectorAll('#bcast-tbody .bcast-row-check').forEach(cb => {
      cb.checked = e.target.checked;
      cb.disabled = false;
      if (e.target.checked) broadcastSelected.add(cb.dataset.id);
      else broadcastSelected.delete(cb.dataset.id);
    });
    updateBroadcastSelectedCount();
  });

  // Select-all-matching-filters
  document.getElementById('bcast-select-all-matching').addEventListener('click', () => {
    broadcastSelectAllMatching = !broadcastSelectAllMatching;
    broadcastSelected = new Set();
    document.querySelectorAll('#bcast-tbody .bcast-row-check').forEach(cb => {
      cb.checked = broadcastSelectAllMatching;
      cb.disabled = broadcastSelectAllMatching;
    });
    document.getElementById('bcast-select-page').checked = broadcastSelectAllMatching;
    document.getElementById('bcast-select-page').disabled = broadcastSelectAllMatching;
    document.getElementById('bcast-select-all-matching').classList.toggle('active', broadcastSelectAllMatching);
    updateBroadcastSelectedCount();
  });

  // Row checkboxes (delegated — survives tbody re-render on pagination)
  document.getElementById('bcast-table-wrap').addEventListener('change', e => {
    const cb = e.target.closest('.bcast-row-check');
    if (!cb) return;
    if (cb.checked) broadcastSelected.add(cb.dataset.id);
    else broadcastSelected.delete(cb.dataset.id);
    updateBroadcastSelectedCount();
  });

  document.getElementById('bcast-send-btn').addEventListener('click', sendBroadcast);

  loadBroadcastUniversities();
  fetchBroadcastRecipients(1);
  fetchBroadcastHistory();
}

async function loadBroadcastUniversities() {
  try {
    const { universities } = await api.get('/admin/broadcast/universities');
    const sel = document.getElementById('bcast-university-filter');
    if (!sel) return;
    universities.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u; opt.textContent = u;
      sel.appendChild(opt);
    });
  } catch {}
}

function broadcastFilterParams() {
  const { q, role, status, verified, university } = broadcastState;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (role !== 'all') params.set('role', role);
  if (status !== 'all') params.set('status', status);
  if (verified !== 'all') params.set('verified', verified);
  if (university !== 'all') params.set('university', university);
  return params;
}

async function fetchBroadcastRecipients(page) {
  broadcastState.page = page;
  const tbody = document.getElementById('bcast-tbody');
  const pgDiv = document.getElementById('bcast-pagination');
  if (!tbody) return;
  tbody.innerHTML = skeletonRows(6);
  try {
    const params = broadcastFilterParams();
    params.set('page', page); params.set('limit', 20);
    const data = await api.get(`/admin/broadcast/recipients?${params}`);

    // Refresh the "select all matching" count whenever filters change
    fetchBroadcastMatchingCount();

    if (!data.users.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--ink-3);padding:32px">No users found</td></tr>`;
      pgDiv.innerHTML = ''; return;
    }

    tbody.innerHTML = data.users.map(u => `
      <tr>
        <td><input type="checkbox" class="bcast-row-check" data-id="${u.id}"
          ${broadcastSelectAllMatching || broadcastSelected.has(String(u.id)) ? 'checked' : ''}
          ${broadcastSelectAllMatching ? 'disabled' : ''}></td>
        <td class="name-cell">${escHtml(u.full_name)}</td>
        <td class="mono">${escHtml(u.email)}</td>
        <td>${roleBadge(u.role)}</td>
        <td>${statusBadge(u.account_status)}</td>
        <td>${u.is_verified ? '✅' : '—'}</td>
      </tr>`).join('');

    pgDiv.innerHTML = paginationHTML(data.page, data.pages, data.total);
    bindPagination('bcast-pagination', fetchBroadcastRecipients);

    // Reflect "select all on page" checkbox state for the freshly-rendered page
    const pageCb = document.getElementById('bcast-select-page');
    if (pageCb) {
      const rows = [...document.querySelectorAll('#bcast-tbody .bcast-row-check')];
      pageCb.checked = broadcastSelectAllMatching || (rows.length > 0 && rows.every(cb => broadcastSelected.has(cb.dataset.id)));
      pageCb.disabled = broadcastSelectAllMatching;
    }
    updateBroadcastSelectedCount();
  } catch(e) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="6" style="color:var(--red,#e53e3e);padding:20px">${e.message}</td></tr>`;
  }
}
window.fetchBroadcastRecipients = fetchBroadcastRecipients;

async function fetchBroadcastMatchingCount() {
  try {
    const params = broadcastFilterParams();
    const data = await api.get(`/admin/broadcast/recipients/ids?${params}`);
    broadcastMatchingCount = data.count;
    const el = document.getElementById('bcast-matching-count');
    if (el) el.textContent = data.count;
  } catch {}
}

function updateBroadcastSelectedCount() {
  const el = document.getElementById('bcast-selected-count');
  if (!el) return;
  const n = broadcastSelectAllMatching ? broadcastMatchingCount : broadcastSelected.size;
  el.textContent = `${n} selected`;
}

async function sendBroadcast() {
  const title = document.getElementById('bcast-title').value.trim();
  const message = document.getElementById('bcast-message').value.trim();
  if (!message) { toast('Write a message first', 'error'); return; }

  let recipientCount = broadcastSelectAllMatching ? broadcastMatchingCount : broadcastSelected.size;
  if (!recipientCount) { toast('Select at least one recipient', 'error'); return; }

  showModal({
    title: 'Send broadcast message?',
    sub: `This will be sent to ${recipientCount} user${recipientCount === 1 ? '' : 's'} and shown as a popup they must acknowledge.`,
    confirmLabel: 'Send message',
    confirmClass: 'btn-primary',
    noReason: true,
    onConfirm: async () => {
      const btn = document.getElementById('bcast-send-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
      try {
        let user_ids;
        if (broadcastSelectAllMatching) {
          const params = broadcastFilterParams();
          const data = await api.get(`/admin/broadcast/recipients/ids?${params}`);
          user_ids = data.ids;
        } else {
          user_ids = [...broadcastSelected];
        }
        const res = await api.post('/admin/broadcast', {
          user_ids, title, message,
          filters: broadcastSelectAllMatching ? { ...broadcastState } : undefined,
        });
        toast(`Message sent to ${res.recipient_count} user${res.recipient_count === 1 ? '' : 's'}.`, 'success');
        document.getElementById('bcast-title').value = '';
        document.getElementById('bcast-message').value = '';
        broadcastSelected = new Set();
        broadcastSelectAllMatching = false;
        fetchBroadcastRecipients(broadcastState.page);
        fetchBroadcastHistory();
      } catch(e) { toast(e.message, 'error'); }
      finally { if (btn) { btn.disabled = false; btn.textContent = 'Send message'; } }
    },
  });
}

async function fetchBroadcastHistory() {
  const el = document.getElementById('bcast-history-list');
  if (!el) return;
  try {
    const data = await api.get('/admin/broadcasts?limit=8');
    if (!data.broadcasts.length) {
      el.innerHTML = `<div class="admin-empty" style="padding:16px 0;">No broadcasts sent yet</div>`;
      return;
    }
    el.innerHTML = data.broadcasts.map(b => `
      <div class="bcast-history-item">
        <div class="bcast-history-top">
          <span class="bcast-history-title">${escHtml(b.title || 'Untitled message')}</span>
          <span class="bcast-history-date">${fmtTime(b.created_at)}</span>
        </div>
        <div class="bcast-history-body">${escHtml((b.content || '').slice(0, 140))}${(b.content || '').length > 140 ? '…' : ''}</div>
        <div class="bcast-history-meta">${b.recipient_count} recipient${b.recipient_count === 1 ? '' : 's'} · ${b.acknowledged_count} read it · sent by ${escHtml(b.sent_by?.full_name || 'admin')}</div>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = `<div class="admin-empty" style="padding:16px 0;color:var(--red,#e53e3e)">${e.message}</div>`;
  }
}

let listingsState = { q: '', status: 'all', page: 1 };

async function renderListings(resetPage) {
  if (resetPage) listingsState.page = 1;
  const c = document.getElementById('admin-content');
  c.innerHTML = `
    <div class="admin-toolbar">
      <input class="admin-search" id="listing-search" placeholder="Search listings…" value="${escHtml(listingsState.q)}">
      <select class="filter-select" id="listing-status-filter">
        <option value="all" ${listingsState.status==='all'?'selected':''}>All statuses</option>
        <option value="active" ${listingsState.status==='active'?'selected':''}>Active</option>
        <option value="pending" ${listingsState.status==='pending'?'selected':''}>Pending</option>
        <option value="sold" ${listingsState.status==='sold'?'selected':''}>Sold</option>
        <option value="deleted" ${listingsState.status==='deleted'?'selected':''}>Deleted</option>
      </select>
    </div>
    <div class="admin-table-wrap" id="listings-table-wrap">
      <table class="admin-table">
        <thead><tr>
          <th>Title</th><th>Seller</th><th>Category</th><th>Price</th>
          <th>Status</th><th>Views</th><th>Created</th><th>Actions</th>
        </tr></thead>
        <tbody id="listings-tbody">${skeletonRows(8)}</tbody>
      </table>
      <div id="listings-pagination"></div>
    </div>`;

  let searchTimer;
  document.getElementById('listing-search').addEventListener('input', e => {
    listingsState.q = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => fetchListings(1), 350);
  });
  document.getElementById('listing-status-filter').addEventListener('change', e => {
    listingsState.status = e.target.value; fetchListings(1);
  });

  // Delegated listener on stable wrapper — attached ONCE, survives tbody replacements
  document.getElementById('listings-table-wrap').addEventListener('click', e => {
    const btn = e.target.closest('.action-btn[data-action]');
    if (!btn) return;
    const { action, id, title } = btn.dataset;
    if (action === 'activate') setListingStatus(id, 'active');
    if (action === 'pending')  setListingStatus(id, 'pending');
    if (action === 'remove')   removeListingConfirm(id, title);
  });

  fetchListings(listingsState.page);
}

async function fetchListings(page) {
  listingsState.page = page;
  const tbody = document.getElementById('listings-tbody');
  const pgDiv = document.getElementById('listings-pagination');
  if (!tbody) return;
  tbody.innerHTML = skeletonRows(8);
  try {
    const params = new URLSearchParams({ page, limit: 20 });
    if (listingsState.q) params.set('q', listingsState.q);
    if (listingsState.status !== 'all') params.set('status', listingsState.status);
    const data = await api.get(`/admin/listings?${params}`);
    if (!data.listings.length) {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--ink-3);padding:32px">No listings found</td></tr>`;
      pgDiv.innerHTML = ''; return;
    }

    tbody.innerHTML = data.listings.map(l => `
      <tr>
        <td class="name-cell" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(l.title)}">${escHtml(l.title)}</td>
        <td>
          <div style="font-size:13px">${escHtml(l.seller_name || '—')}</div>
          <div class="mono">${escHtml(l.seller_email || '')}</div>
        </td>
        <td>${escHtml(l.category)}</td>
        <td style="font-weight:600">${formatPrice(l.price)}</td>
        <td>${listingStatusBadge(l.status)}</td>
        <td>${l.views || 0}</td>
        <td>${fmt(l.created_at)}</td>
        <td>
          <div class="action-btns">
            ${l.status !== 'active'  ? `<button class="action-btn restore" data-action="activate" data-id="${l._id}">Activate</button>` : ''}
            ${l.status !== 'pending' ? `<button class="action-btn warn"    data-action="pending"  data-id="${l._id}">Pending</button>` : ''}
            ${l.status !== 'deleted' ? `<button class="action-btn kick"    data-action="remove"   data-id="${l._id}" data-title="${escHtml(l.title)}">Remove</button>` : ''}
          </div>
        </td>
      </tr>`).join('');

    pgDiv.innerHTML = paginationHTML(data.page, data.pages, data.total);
    bindPagination('listings-pagination', fetchListings);
  } catch(e) {
    if (tbody) tbody.innerHTML = `<tr><td colspan="8" style="color:var(--red,#e53e3e);padding:20px">${e.message}</td></tr>`;
  }
}
window.fetchListings = fetchListings;

async function setListingStatus(id, status) {
  try {
    await api.patch(`/admin/listings/${id}/status`, { status });
    toast(`Listing marked as ${status}`, 'success');
    fetchListings(listingsState.page);
  } catch(e) { toast(e.message, 'error'); }
}

function removeListingConfirm(id, title) {
  showModal({
    title: 'Remove listing?',
    sub: `"${title}" will be removed from the marketplace.`,
    confirmLabel: 'Remove Listing',
    confirmClass: 'btn-primary',
    noReason: true,
    onConfirm: async () => {
      try {
        await api.delete(`/admin/listings/${id}`);
        toast('Listing removed.', 'success');
        fetchListings(listingsState.page);
      } catch(e) { toast(e.message, 'error'); }
    }
  });
}

// USER PROFILE REPORTS
// ══════════════════════════════════════════════════════════════════════════════
async function renderUserReports() {
  const c = document.getElementById('admin-content');
  c.innerHTML = `<div style="margin-bottom:18px;"><div class="section-kicker">Safety</div><h2 style="font-size:28px;">User profile reports</h2><p style="color:var(--ink-3);font-size:13px;margin-top:6px;">Review reports submitted from buyer and seller profiles. Upholding a seller report lowers their marketplace discoverability; you can also warn or suspend the account.</p></div><div id="user-report-list"></div>`;
  await fetchUserReports('pending');
}

async function fetchUserReports(status = 'pending') {
  const c = document.getElementById('user-report-list');
  if (!c) return;
  try {
    const data = await api.get(`${controlPath('/admin/user-reports')}?status=${status}`);
    const reports = data.reports || [];
    c.innerHTML = `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      ${['pending','resolved','dismissed','all'].map(s => `<button class="btn btn-${s===status?'primary':'surface'} btn-sm" data-ur-status="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}
    </div>` + (reports.length ? reports.map(r => {
      const u = r.reported_user_id || {};
      const reporter = r.reporter_id || {};
      return `<div class="card" style="padding:16px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;">
          <div><strong>${escHtml(u.full_name || 'Unknown user')}</strong> <span class="badge badge-surface">${escHtml(u.role || '')}</span><div style="font-size:12px;color:var(--ink-3);margin-top:3px;">Reported by ${escHtml(reporter.full_name || 'Unknown')} · ${fmtTime(r.created_at)}</div></div>
          <span class="report-badge ${r.status}">${r.status}</span>
        </div>
        <div style="margin-top:12px;padding:11px;background:var(--bg);border-radius:9px;font-size:13px;">${escHtml(r.reason)}</div>
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-3);">
          <span>Reports upheld: ${u.report_count || 0}</span><span>Discoverability: ${u.discoverability_score ?? 100}/100</span><span>Rating: ${u.rating ? Number(u.rating).toFixed(1) : '—'}</span>
        </div>
        ${r.status === 'pending' && !isControlUser() ? `<div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;">
          <select class="form-input" data-ur-action="${r.id}" style="max-width:150px;"><option value="none">No account action</option><option value="warn">Warn user</option><option value="suspend">Suspend user</option></select>
          <input class="form-input" data-ur-note="${r.id}" placeholder="Admin note / reason" style="flex:1;min-width:220px;">
          <button class="btn btn-primary btn-sm" data-ur-uphold="${r.id}">Uphold report</button>
          <button class="btn btn-surface btn-sm" data-ur-dismiss="${r.id}">Dismiss</button>
        </div>` : `<div style="margin-top:10px;font-size:12px;color:var(--ink-3);">${r.fault_confirmed ? 'Report upheld.' : 'Report dismissed.'}${r.admin_note ? ' ' + escHtml(r.admin_note) : ''}</div>`}
      </div>`;
    }).join('') : `<div class="admin-empty">No ${status === 'all' ? '' : status + ' '}user reports.</div>`);

    c.querySelectorAll('[data-ur-status]').forEach(b => b.onclick = () => fetchUserReports(b.dataset.urStatus));
    c.querySelectorAll('[data-ur-uphold]').forEach(b => b.onclick = () => resolveUserReport(b.dataset.urUphold, true));
    c.querySelectorAll('[data-ur-dismiss]').forEach(b => b.onclick = () => resolveUserReport(b.dataset.urDismiss, false));
  } catch (e) { c.innerHTML = `<div class="admin-empty">${escHtml(e.message)}</div>`; }
}

async function resolveUserReport(id, upheld) {
  if (isControlUser()) return toast('Control accounts can only read user reports.', 'warning');
  const action = document.querySelector(`[data-ur-action="${id}"]`)?.value || 'none';
  const note = document.querySelector(`[data-ur-note="${id}"]`)?.value?.trim() || '';
  if (upheld && !note) { toast('Add an admin note/reason before upholding a report.', 'error'); return; }
  try {
    await api.post(`/admin/user-reports/${id}/resolve`, { fault_confirmed: upheld, admin_note: note, action });
    toast(upheld ? 'Report upheld and user record updated.' : 'Report dismissed.', 'success');
    await fetchUserReports('pending');
  } catch (e) { toast(e.message, 'error'); }
}

let msgsState = { page: 1, selectedConvId: null };

async function renderMessages() {
  const c = document.getElementById('admin-content');
  c.innerHTML = `
    <div class="admin-table-wrap" style="overflow:hidden">
      <div class="msg-layout">
        <div class="msg-list" id="msg-conv-list">
          <div style="padding:12px 16px;border-bottom:1.5px solid var(--border);">
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:10px;">Reported Conversations</div>
            <div class="report-filter-tabs" id="report-filter-tabs">
              <div class="report-filter-tab active" data-status="pending">Pending</div>
              <div class="report-filter-tab" data-status="resolved">Resolved</div>
              <div class="report-filter-tab" data-status="all">All</div>
            </div>
          </div>
          <div id="conv-list-inner"></div>
          <div id="conv-list-pg"></div>
        </div>
        <div class="msg-panel" id="msg-thread-panel">

    tab.classList.add('active');
